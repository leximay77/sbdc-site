{% extends 'base.html' %}
{% block head %}
<style>
    .music-container {
        display: flex;
        flex-wrap: wrap;
        gap: 2rem;
        justify-content: center;
    }

    .music-item {
        flex: 1 1 300px;
        min-width: 0;
        max-width: 500px;
    }

    .music-item h2 {
        margin: 0.5rem 0;
    }

    .music-item iframe {
        border: 0;
        width: 100%;
    }

    @media (max-width: 768px) {
        .music-item {
            flex: 1 1 100%;
        }
    }
</style>
{% endblock %}
{% block content %}
    <main class="container">
        <h1 class="heading-primary bold-underline">Blues Music</h1>
        <p>We've compiled some sample playlists of Blues music from various artists and eras. Blues was born in the 19th century, but new Blues music is still being created today!</p>
        <div class="music-container">
            <div class="music-item">
                <h2 class="heading-secondary">Spotify</h2>
                <iframe title="SBDC blues playlist on Spotify" src="https://open.spotify.com/embed/playlist/3AfOcDEH80lssVo4D3LwHj?si=VrT3vkBrTUKgEUqWzi2J4Q" height="380" allow="encrypted-media"></iframe>
            </div>
            <div class="music-item">
                <h2 class="heading-secondary">Apple Music</h2>
                <iframe title="SBDC blues playlist on Apple Music" allow="autoplay *; encrypted-media *;" height="380" sandbox="allow-forms allow-popups allow-same-origin allow-scripts allow-storage-access-by-user-activation allow-top-navigation-by-user-activation" src="https://embed.music.apple.com/us/playlist/blues-intro/pl.u-Ymb09WmhPbXDYx4"></iframe>
            </div>
        </div>
    </main>
{% endblock %}
